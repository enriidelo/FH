// ---- services/inventory.js ----
const InventoryService = {
  list() {
    return store.get().inventory.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  },

  get(id) {
    return store.get().inventory.find(i => i.id === id);
  },

  create({ name, category, quantityPurchased, purchasePrice, salePrice, cycleId }) {
    const item = {
      id: uid(),
      name: name.trim(),
      category: category || '',
      quantityPurchased: Math.max(0, Number(quantityPurchased) || 0),
      quantitySold: 0,
      purchasePrice: Number(purchasePrice) || 0,
      salePrice: Number(salePrice) || 0,
      cycleId: cycleId || null,
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.inventory.push(item));
    return item;
  },

  update(id, patch) {
    store.commit(d => {
      const i = d.inventory.find(x => x.id === id);
      if (i) Object.assign(i, patch, { updatedAt: nowISO() });
    });
  },

  registerSale(id, quantity) {
    const item = this.get(id);
    if (!item) return;
    const qty = Math.min(quantity, this.available(id));
    if (qty <= 0) return;
    this.update(id, { quantitySold: item.quantitySold + qty });
  },

  delete(id) {
    store.commit(d => { d.inventory = d.inventory.filter(i => i.id !== id); });
  },

  available(id) {
    const i = this.get(id);
    return i ? Math.max(0, i.quantityPurchased - i.quantitySold) : 0;
  },

  metrics(id) {
    const i = this.get(id);
    if (!i) return null;
    const available = this.available(id);
    return {
      available,
      totalCost: i.quantityPurchased * i.purchasePrice,
      inventoryValue: available * i.purchasePrice,
      potentialRevenue: available * i.salePrice,
      potentialProfit: available * (i.salePrice - i.purchasePrice),
      realizedRevenue: i.quantitySold * i.salePrice,
    };
  },

  totalInventoryValue() {
    return this.list().reduce((sum, i) => sum + this.metrics(i.id).inventoryValue, 0);
  },
};

function openInvestmentForm(existing) {
  const accounts = AccountsService.list();
  const node = openSheet(`
    <div class="sheet-title">${existing ? 'Modifica investimento' : 'Nuovo investimento'}</div>
    <div class="field"><label>Nome</label><input id="i-name" placeholder="es. ETF World, BTC, Fondo pensione..." value="${existing ? escapeAttr(existing.name) : ''}" /></div>
    <div class="field"><label>Capitale investito</label><input id="i-capital" type="number" step="0.01" min="0" value="${existing ? existing.capitalInvested : ''}" /></div>
    <div class="field"><label>Valore attuale</label><input id="i-current" type="number" step="0.01" min="0" value="${existing ? existing.currentValue : ''}" /></div>
    <div class="field"><label>Data inizio</label><input id="i-start" type="date" value="${existing ? existing.startDate : nowISO().slice(0, 10)}" /></div>
    ${accounts.length ? `<div class="field"><label>Account collegato (opzionale)</label>
      <select id="i-account"><option value="">Nessuno</option>${accounts.map(a => `<option value="${a.id}" ${existing?.accountId === a.id ? 'selected' : ''}>${a.icon} ${escapeAttr(a.name)}</option>`).join('')}</select>
      <p style="color:var(--text-secondary);font-size:12px;margin-top:8px">${existing ? 'Usato per proporre il movimento quando chiudi l\'investimento.' : 'Se scelto, alla creazione ti proporrò di spostare il capitale investito da questo account.'}</p>
    </div>` : ''}
    <div class="field"><label>Note (opzionale)</label><textarea id="i-notes">${existing ? escapeAttr(existing.notes) : ''}</textarea></div>
    <button class="btn btn-primary" id="i-save">Salva</button>
  `);

  node.querySelector('#i-save').addEventListener('click', () => {
    const name = node.querySelector('#i-name').value.trim();
    const capital = parseFloat(node.querySelector('#i-capital').value);
    if (!name || isNaN(capital) || capital < 0) { toast('Inserisci nome e capitale investito validi.'); return; }
    const accountId = node.querySelector('#i-account')?.value || null;
    const payload = {
      name,
      capitalInvested: capital,
      currentValue: node.querySelector('#i-current').value,
      startDate: node.querySelector('#i-start').value,
      accountId,
      notes: node.querySelector('#i-notes').value.trim(),
    };
    if (existing) {
      InvestmentsService.update(existing.id, { ...payload, currentValue: parseFloat(payload.currentValue) || 0 });
      toast('Investimento aggiornato.');
      closeSheet();
    } else {
      InvestmentsService.create(payload);
      closeSheet();
      if (accountId && capital > 0) {
        // Real link: funding a new investment from an account actually
        // proposes moving the capital out of that account.
        openTransactionSheet(null, 'expense', null, capital, `Investimento: ${name}`, accountId);
      } else {
        toast('Investimento creato.');
      }
    }
    renderCurrentRoute();
  });
}

// ---- views/calendar.js ----
let viewMonth = new Date();
let selectedDate = null;

async function renderCalendar(root) {
  root.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <button class="icon-btn" id="cal-prev">‹</button>
      <div style="font-family:var(--font-display);font-weight:700;font-size:16px" id="cal-title"></div>
      <button class="icon-btn" id="cal-next">›</button>
    </div>
    <div class="card" style="padding:var(--space-4)">
      <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
    </div>
    <div class="section-title" id="cal-agenda-title">Oggi</div>
    <div id="cal-agenda"></div>
  `;

  root.querySelector('#cal-prev').addEventListener('click', () => { viewMonth.setMonth(viewMonth.getMonth() - 1); renderCalendar(root); });
  root.querySelector('#cal-next').addEventListener('click', () => { viewMonth.setMonth(viewMonth.getMonth() + 1); renderCalendar(root); });

  const eventsByDay = collectEvents();

  root.querySelector('#cal-title').textContent = viewMonth.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

  const grid = root.querySelector('#cal-grid');
  ['L', 'M', 'M', 'G', 'V', 'S', 'D'].forEach(d => {
    grid.appendChild(el(`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--text-secondary);padding:4px 0">${d}</div>`));
  });

  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);
  if (!selectedDate) selectedDate = todayStr;

  for (let i = 0; i < startOffset; i++) grid.appendChild(el('<div></div>'));

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const events = eventsByDay[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const cell = el(`
      <button style="
        aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
        border-radius:10px;font-size:13px;font-weight:${isToday ? '800' : '600'};
        background:${isSelected ? 'var(--primary)' : 'transparent'};
        color:${isSelected ? 'var(--background)' : isToday ? 'var(--primary)' : 'var(--text)'};
      ">
        <span>${day}</span>
        ${events.length ? `<span style="display:flex;gap:2px">${events.slice(0, 3).map(e => `<span style="width:4px;height:4px;border-radius:50%;background:${isSelected ? 'var(--background)' : e.color}"></span>`).join('')}</span>` : ''}
      </button>
    `);
    cell.addEventListener('click', () => { selectedDate = dateStr; renderCalendar(root); });
    grid.appendChild(cell);
  }

  const agendaTitle = root.querySelector('#cal-agenda-title');
  const agenda = root.querySelector('#cal-agenda');
  const dayEvents = eventsByDay[selectedDate] || [];
  agendaTitle.textContent = new Date(selectedDate + 'T00:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });

  if (!dayEvents.length) {
    agenda.appendChild(el(`<div class="card"><div class="empty-state" style="padding:16px 0"><p>Nessun evento in questa data.</p></div></div>`));
  } else {
    dayEvents.forEach(e => {
      agenda.appendChild(el(`
        <div class="list-row card" style="margin-bottom:8px;padding:var(--space-4)">
          <div class="row-icon" style="background:${e.color}22;color:${e.color}">${e.icon}</div>
          <div class="row-main"><div class="row-title">${escapeAttr(e.title)}</div><div class="row-sub">${escapeAttr(e.subtitle || '')}</div></div>
          ${e.amount !== undefined ? `<div class="row-value num">${formatMoney(e.amount)}</div>` : ''}
        </div>
      `));
    });
  }
}

function collectEvents() {
  const data = store.get();
  const byDay = {};
  const push = (date, event) => {
    if (!date) return;
    (byDay[date] = byDay[date] || []).push(event);
  };

  data.transactions.forEach(tx => {
    const acc = AccountsService.get(tx.accountId);
    push(tx.date, {
      icon: tx.type === 'income' ? '⬆️' : '⬇️',
      color: tx.type === 'income' ? '#3DD68C' : '#FF6B6B',
      title: tx.note || (tx.type === 'income' ? t('income') : t('expense')),
      subtitle: acc?.name,
      amount: tx.type === 'income' ? tx.amount : -tx.amount,
    });
  });

  if (ModuleManager.isEnabled('recurrences')) {
    data.recurrences.filter(r => r.active).forEach(r => {
      push(r.nextDate, { icon: '🔁', color: '#5B8DEF', title: r.note || t('recurrences'), subtitle: 'Prossima occorrenza' });
    });
  }

  if (ModuleManager.isEnabled('cycles')) {
    CyclesService.list().forEach(c => {
      push(c.startDate, { icon: '🔄', color: '#B98BE0', title: c.name, subtitle: 'Inizio ciclo' });
      if (c.endDate) push(c.endDate, { icon: '🏁', color: '#B98BE0', title: c.name, subtitle: 'Fine ciclo' });
    });
  }

  if (ModuleManager.isEnabled('goals')) {
    GoalsService.list().forEach(g => {
      if (g.targetDate) push(g.targetDate, { icon: g.icon, color: g.color, title: g.name, subtitle: 'Scadenza obiettivo' });
    });
  }

  return byDay;
}

function escapeAttr(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }


// ---- services/forecasts.js ----
function nextOccurrence(dateStr, frequency, interval = 1) {
  const d = new Date(dateStr + 'T00:00:00');
  if (frequency === 'daily') d.setDate(d.getDate() + interval);
  else if (frequency === 'weekly') d.setDate(d.getDate() + 7 * interval);
  else if (frequency === 'monthly') d.setMonth(d.getMonth() + interval);
  else if (frequency === 'yearly') d.setFullYear(d.getFullYear() + interval);
  return d.toISOString().slice(0, 10);
}

const ForecastsService = {
  /** Confirmed = current net worth + every recurring transaction due within `days`. Read-only, no side effects. */
  confirmedDelta(days) {
    const horizon = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    const recs = store.get().recurrences.filter(r => r.active);
    let delta = 0;
    recs.forEach(r => {
      let cursor = r.nextDate;
      let guard = 0;
      while (cursor <= horizon && (!r.endDate || cursor <= r.endDate) && guard < 1000) {
        delta += r.type === 'income' ? r.amount : -r.amount;
        cursor = nextOccurrence(cursor, r.frequency, r.interval);
        guard++;
      }
    });
    return delta;
  },

  /** Estimated adds the still-uncollected estimated revenue of open cycles, as upside. */
  estimatedUpside() {
    if (!ModuleManager.isEnabled('cycles')) return 0;
    return CyclesService.list()
      .filter(c => c.status !== 'COMPLETED' && c.status !== 'CANCELLED')
      .reduce((sum, c) => {
        const m = CyclesService.metrics(c.id);
        return sum + Math.max(0, m.revenueEstimated - m.revenueCollected);
      }, 0);
  },

  project(days) {
    const base = Analytics.calculateNetWorth();
    const confirmed = base + this.confirmedDelta(days);
    const estimated = confirmed + this.estimatedUpside();
    return { confirmed, estimated };
  },

  horizons() {
    return [0, 30, 60, 90].map(days => ({ days, ...this.project(days) }));
  },
};

  const horizons = ForecastsService.horizons();
  const hasUpside = ForecastsService.estimatedUpside() > 0;

  const list = root.querySelector('#forecast-list');

}


// ---- services/search.js ----
const SearchService = {
  search(query) {
    const q = (query || '').trim().toLowerCase();
    if (!q) return { transactions: [], accounts: [], tags: [], cycles: [], inventory: [], goals: [] };
    const data = store.get();
    const has = (s) => (s || '').toLowerCase().includes(q);

    return {
      transactions: data.transactions.filter(t => has(t.note)).slice(0, 20),
      accounts: data.accounts.filter(a => !a.archived && has(a.name)),
      tags: data.tags.filter(t => has(t.name)),
      cycles: ModuleManager.isEnabled('cycles') ? data.cycles.filter(c => has(c.name) || has(c.platform)) : [],
      inventory: ModuleManager.isEnabled('inventory') ? data.inventory.filter(i => has(i.name) || has(i.category)) : [],
      goals: ModuleManager.isEnabled('goals') ? data.goals.filter(g => has(g.name)) : [],
    };
  },
};

async function renderSearch(root) {
  root.innerHTML = `
    <div class="field" style="margin-bottom:16px">
      <input id="global-search" placeholder="Cerca ovunque: movimenti, account, tag, cicli, prodotti, obiettivi..." autofocus />
    </div>
    <div id="search-results"></div>
  `;

  const resultsNode = root.querySelector('#search-results');
  root.querySelector('#global-search').addEventListener('input', debounce(e => runSearch(e.target.value, resultsNode), 200));
}

function runSearch(query, node) {
  if (!query.trim()) {
    node.innerHTML = `<div class="empty-state"><div class="glyph">🔍</div><p>Digita per cercare in tutta l'app.</p></div>`;
    return;
  }
  const r = SearchService.search(query);
  const totalCount = r.transactions.length + r.accounts.length + r.tags.length + r.cycles.length + r.inventory.length + r.goals.length;
  node.innerHTML = '';

  if (!totalCount) {
    node.appendChild(el(`<div class="empty-state"><div class="glyph">🔍</div><p>Nessun risultato per "${escapeAttr(query)}".</p></div>`));
    return;
  }

  if (r.accounts.length) node.appendChild(section(t('accounts'), r.accounts.map(a => row('🏦', a.name, '', () => navigate('accounts'))), 'accounts'));
  if (r.transactions.length) node.appendChild(section('Movimenti', r.transactions.map(tx => {
    const acc = AccountsService.get(tx.accountId);
    return row(tx.type === 'income' ? '⬆️' : '⬇️', tx.note || (tx.type === 'income' ? t('income') : t('expense')), `${acc?.name || ''} · ${formatDate(tx.date)} · ${formatMoney(tx.amount)}`, () => navigate('finance'));
  }), 'finance'));
  if (r.tags.length) node.appendChild(section('Tag', r.tags.map(tg => row(tg.icon, tg.name, '', () => navigate('finance')))));
  if (r.cycles.length) node.appendChild(section(t('cycles'), r.cycles.map(c => row('🔄', c.name, c.platform || '', () => navigate('cycles'))), 'cycles'));
  if (r.inventory.length) node.appendChild(section(t('inventory'), r.inventory.map(i => row('📦', i.name, i.category || '', () => navigate('inventory'))), 'inventory'));
  if (r.goals.length) node.appendChild(section(t('goals'), r.goals.map(g => row(g.icon, g.name, '', () => navigate('goals'))), 'goals'));
}

function section(title, rows, iconKey) {
  const wrap = el(`<div style="margin-bottom:16px"></div>`);
  wrap.appendChild(el(`<div class="section-title" style="margin-top:0"><span class="st-label">${iconKey ? sectionIcon(iconKey) : ''}${title}</span></div>`));
  const card = el(`<div class="card" style="padding:4px var(--space-5)"></div>`);
  rows.forEach(r => card.appendChild(r));
  wrap.appendChild(card);
  return wrap;
}

function row(icon, title, sub, onClick) {
  const node = el(`
    <div class="list-row" style="cursor:pointer">
      <div class="row-icon">${icon}</div>
      <div class="row-main"><div class="row-title">${escapeAttr(title)}</div>${sub ? `<div class="row-sub">${escapeAttr(sub)}</div>` : ''}</div>
    </div>
  `);
  node.addEventListener('click', onClick);
  return node;
}

function escapeAttr(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderFab() {
  const container = document.getElementById('fab-container');
  const actions = ModuleManager.getQuickActions();
  if (!actions.length) { container.innerHTML = ''; return; }

  container.innerHTML = `
    <div class="overlay-scrim" id="fab-scrim"></div>
    <div class="fab-menu" id="fab-menu" style="display:none">
      ${actions.map(a => `
        <div class="fab-menu-item" data-route="${a.route}" data-payload='${JSON.stringify(a.payload || {})}'>
          <span class="label">${a.label}</span>
          <span class="dot">${a.icon}</span>
        </div>
      `).join('')}
    </div>
    <button class="fab" id="fab-btn">${icon('plus')}</button>
  `;

  const fabBtn = document.getElementById('fab-btn');
  const menu = document.getElementById('fab-menu');
  const scrim = document.getElementById('fab-scrim');
  let open = false;

  function setOpen(v) {
    open = v;
    fabBtn.classList.toggle('open', open);
    menu.style.display = open ? 'flex' : 'none';
    scrim.classList.toggle('visible', open);
  }

  fabBtn.addEventListener('click', () => setOpen(!open));
  scrim.addEventListener('click', () => setOpen(false));
  menu.querySelectorAll('.fab-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      setOpen(false);
      const payload = JSON.parse(item.dataset.payload || '{}');
      navigate(item.dataset.route, payload);
    });
  });
}

function refreshChrome() {
  renderNav();
  renderFab();
}

window.addEventListener('nav:refresh', refreshChrome);

function boot() {
  applyTheme();
  refreshChrome();

  document.getElementById('header-search-btn')?.addEventListener('click', () => navigate('search'));
  document.getElementById('header-settings-btn')?.addEventListener('click', () => navigate('settings'));

  if (store.get().onboarded) {
    const generated = RecurrencesService.processAll();
    if (generated > 0) refreshChrome();
  }

  const startApp = () => {
    if (!store.get().onboarded) {
      renderOnboarding(() => {
        refreshChrome();
        startRouter();
      });
    } else {
      startRouter();
    }
  };

  if (store.get().onboarded && isPinSet()) {
    document.getElementById('app').style.display = 'none';
    showLock(() => {
      document.getElementById('app').style.display = '';
      startApp();
    });
  } else {
    startApp();
  }

  store.subscribe(() => {
    refreshChrome();
  });

  // Ambient background: restart on load and every time the app comes back
  // into view — covers app switches, screen lock/unlock and the OS bfcache.
  restartAmbientAnimations();
  window.addEventListener('pageshow', restartAmbientAnimations);
  window.addEventListener('focus', restartAmbientAnimations);

  // Auto-lock: re-show the PIN pad when the app regains visibility, if enabled.
  let hiddenAt = null;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
    } else {
      restartAmbientAnimations();
      if (hiddenAt && store.get().settings.autoLock && isPinSet()) {
        document.getElementById('app').style.display = 'none';
        showLock(() => { document.getElementById('app').style.display = ''; });
      }
    }
  });
}

boot();

</script>
</body>
</html>

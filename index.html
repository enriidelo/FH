<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title id="page-title">Finance Hub</title>
<meta name="description" content="La tua piattaforma finanziaria personale, offline e completamente personalizzabile." />
<meta name="theme-color" content="#0F1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finance Hub" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  /* Base palette — dark, premium fintech. Overridable at runtime by the Theme Engine. */
  --primary: #C8A84B;
  --primary-rgb: 200, 168, 75;
  --background: #0F1115;
  --surface: #171A21;
  --surface-2: #1F232C;
  --text: #EDEFF3;
  --text-secondary: #8B93A7;
  --positive: #3DD68C;
  --negative: #FF6B6B;
  --warning: #F5B942;
  --border: #262B35;

  /* Density / shape — adjustable via presets */
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 20px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --font-size-base: 15px;
  --font-scale: 1;

  --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --nav-height: 64px;
  --header-height: 56px;
  --ambient-opacity: 1;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.24);
  --shadow-md: 0 10px 24px -12px rgba(0,0,0,.55), 0 2px 6px -1px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 48px -20px rgba(0,0,0,.6), 0 8px 16px -6px rgba(0,0,0,.4);
  --shadow-glow: 0 0 0 1px rgba(var(--primary-rgb), .12), 0 16px 40px -18px rgba(var(--primary-rgb), .35);
  --ease-spring: cubic-bezier(.22, 1, .36, 1);
}

@keyframes viewEnter {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fabBreathe {
  0%, 100% { transform: scale(1); opacity: .55; }
  50% { transform: scale(1.18); opacity: .15; }
}
@keyframes floatGlyph {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes shimmerSweep {
  0% { transform: translateX(-120%) rotate(8deg); }
  100% { transform: translateX(220%) rotate(8deg); }
}
@keyframes auroraDrift1 {
  0%   { transform: translate(-6%, -4%) scale(1); }
  50%  { transform: translate(4%, 6%) scale(1.12); }
  100% { transform: translate(-6%, -4%) scale(1); }
}
@keyframes auroraDrift2 {
  0%   { transform: translate(6%, 5%) scale(1.05); }
  50%  { transform: translate(-5%, -6%) scale(.95); }
  100% { transform: translate(6%, 5%) scale(1.05); }
}
@keyframes twinkle {
  0%, 100% { opacity: .35; }
  50% { opacity: .9; }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.92); }
  to   { opacity: 1; transform: scale(1); }
}

[data-theme="light"] {
  --background: #F5F4F1;
  --surface: #FFFFFF;
  --surface-2: #EFEDE8;
  --text: #17181C;
  --text-secondary: #6B7280;
  --border: #E3E1DB;
}

/* Density presets */
[data-density="compact"] {
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --radius-m: 10px;
  --radius-l: 14px;
}
[data-density="comfortable"] {
  --space-3: 16px;
  --space-4: 22px;
  --space-5: 30px;
}

/* Style presets: minimal/classic drop shadows and glam entirely, compact keeps
   only a whisper of it, premium gets the full treatment. Radius/typography/
   ambient intensity are set inline via applyTheme(); this block reacts to them. */
[data-shadows="none"] {
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: 0 1px 2px rgba(0,0,0,.18);
  --shadow-glow: none;
}
[data-shadows="low"] {
  --shadow-md: var(--shadow-sm);
  --shadow-lg: 0 4px 10px -6px rgba(0,0,0,.4);
  --shadow-glow: none;
}
[data-shadows="none"] .card::before,
[data-shadows="none"] .btn-primary,
[data-shadows="low"] .card::before { box-shadow: none; }
[data-shadows="none"] .card::before { display: none; }
[data-shadows="none"] .btn-primary { box-shadow: none; }

[data-preset="minimal"] .hero-metric,
[data-preset="classic"] .hero-metric { box-shadow: none; }
[data-preset="minimal"] .hero-metric .value,
[data-preset="classic"] .hero-metric .value {
  background: none;
  -webkit-text-fill-color: var(--primary);
  color: var(--primary);
}
[data-preset="minimal"] .hero-metric::after,
[data-preset="classic"] .hero-metric::after,
[data-preset="compact"] .hero-metric::after { content: none; }

[data-preset="minimal"] .fab::before,
[data-preset="classic"] .fab::before { display: none; }
[data-preset="compact"] .fab::before { opacity: .2; }

[data-preset="classic"] .sheet { border-radius: var(--radius-l) var(--radius-l) 0 0; }
[data-preset="classic"] .segmented button.active { box-shadow: none; border: 1px solid var(--border); }
[data-preset="classic"] .section-title { text-transform: uppercase; letter-spacing: .06em; }

[data-preset="compact"] .empty-state .glyph { animation: none; }
[data-preset="compact"] .empty-state { padding: var(--space-4) var(--space-4); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  font-size: calc(var(--font-size-base) * var(--font-scale));
  background: var(--background);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* Ambient backdrop: slow-drifting aurora glow + a faint field of stars.
   Real DOM nodes (not ::before/::after) so JS can force-restart them after
   the tab/app comes back from background — pseudo-element animations are
   prone to getting stuck by mobile browsers after a backgrounding cycle. */
.bg-aurora-a, .bg-aurora-b, .bg-stars {
  position: fixed;
  inset: -12%;
  pointer-events: none;
}
.bg-aurora-a {
  z-index: -3;
  background:
    radial-gradient(circle at 18% 12%, rgba(var(--primary-rgb), .18), transparent 40%),
    radial-gradient(circle at 82% 78%, rgba(91, 141, 239, .13), transparent 44%);
  filter: blur(60px);
  opacity: calc(var(--ambient-opacity, 1) * .8);
  animation: auroraDrift1 28s ease-in-out infinite;
  will-change: transform;
}
.bg-aurora-b {
  z-index: -2;
  background: radial-gradient(circle at 60% 32%, rgba(61, 214, 140, .1), transparent 38%);
  filter: blur(60px);
  opacity: calc(var(--ambient-opacity, 1) * .8);
  animation: auroraDrift2 22s ease-in-out infinite;
  will-change: transform;
}
.bg-stars {
  z-index: -1;
  inset: 0;
  opacity: calc(var(--ambient-opacity, 1) * .55);
  background-repeat: no-repeat;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.4px 1.4px at 78% 12%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.2px 1.2px at 58% 68%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.6px 1.6px at 30% 84%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.2px 1.2px at 90% 58%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.4px 1.4px at 45% 40%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.2px 1.2px at 6% 55%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.4px 1.4px at 68% 90%, rgba(255,255,255,.3), transparent);
  animation: twinkle 6s ease-in-out infinite;
  will-change: opacity;
}
[data-theme="light"] .bg-aurora-a, [data-theme="light"] .bg-aurora-b { opacity: calc(var(--ambient-opacity, 1) * .45); }
[data-theme="light"] .bg-stars { opacity: calc(var(--ambient-opacity, 1) * .12); }
h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; padding: 0; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
button:focus-visible, [tabindex]:focus-visible { border-radius: var(--radius-s); }

.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  .bg-aurora-a, .bg-aurora-b, .bg-stars, .fab::before, .empty-state .glyph { animation: none !important; }
}
#app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: calc(var(--safe-top) + var(--space-3)) var(--space-4) var(--space-3);
  background: color-mix(in srgb, var(--background) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.app-header h1 {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.header-actions { display: flex; align-items: center; gap: var(--space-2); }

.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-m);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: transform .15s var(--ease-spring), background .15s ease;
}
.icon-btn:active { transform: scale(0.92); }

main.view {
  flex: 1;
  padding: var(--space-4) var(--space-4) calc(var(--nav-height) + var(--safe-bottom) + var(--space-6));
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
main.view.route-enter { animation: viewEnter .32s var(--ease-spring); }

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) 0 calc(var(--space-2) - 2px);
  height: var(--nav-height);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
}
.nav-item svg { width: 22px; height: 22px; transition: transform .22s var(--ease-spring); }
.nav-item { transition: color .18s ease; }
.nav-item.active { color: var(--primary); }
.nav-item.active svg { transform: translateY(-1px) scale(1.08); }
.nav-item:active svg { transform: scale(.88); }

.fab {
  position: fixed;
  right: var(--space-5);
  bottom: calc(var(--nav-height) + var(--safe-bottom) + var(--space-4));
  z-index: 25;
  width: 56px; height: 56px;
  border-radius: 18px;
  background: var(--primary);
  color: var(--background);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px -6px rgba(var(--primary-rgb), 0.45);
  transition: transform .32s var(--ease-spring);
}
.fab::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 22px;
  background: var(--primary);
  opacity: .35;
  z-index: -1;
  animation: fabBreathe 2.6s ease-in-out infinite;
}
.fab svg { width: 26px; height: 26px; }
.fab.open { transform: rotate(45deg) scale(1.04); }
.fab:active { transform: scale(.92); }
.fab.open:active { transform: rotate(45deg) scale(.96); }

.fab-menu {
  position: fixed;
  right: var(--space-5);
  bottom: calc(var(--nav-height) + var(--safe-bottom) + var(--space-4) + 68px);
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--space-3);
}

.fab-menu-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  animation: popIn .22s var(--ease-spring) backwards;
}
.fab-menu-item:nth-child(1) { animation-delay: .02s; }
.fab-menu-item:nth-child(2) { animation-delay: .06s; }
.fab-menu-item:nth-child(3) { animation-delay: .10s; }
.fab-menu-item:nth-child(4) { animation-delay: .14s; }
.fab-menu-item:nth-child(5) { animation-delay: .18s; }
.fab-menu-item .dot { transition: transform .15s var(--ease-spring); }
.fab-menu-item:active .dot { transform: scale(.9); }
.fab-menu-item .label {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-m);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.fab-menu-item .dot {
  width: 46px; height: 46px;
  border-radius: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.fab-menu-item .dot svg { width: 20px; height: 20px; }

.overlay-scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 24;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
}
.overlay-scrim.visible { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 22px 22px 0 0;
  max-height: 88vh;
  overflow-y: auto;
  padding: var(--space-5) var(--space-5) calc(var(--safe-bottom) + var(--space-6));
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow: var(--shadow-lg);
}
.sheet.visible { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 0 auto var(--space-4);
}

.sheet-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: var(--space-4);
}

@media (min-width: 900px) {
  .app-header, main.view { max-width: 880px; }
  .bottom-nav {
    left: 0; right: auto; top: 0; bottom: 0;
    width: 88px; flex-direction: column;
    border-top: none; border-right: 1px solid var(--border);
    padding-top: calc(var(--safe-top) + var(--space-4));
  }
  #app { flex-direction: row; }
  main.view { padding-left: calc(88px + var(--space-4)); padding-bottom: var(--space-6); }
  .app-header { padding-left: calc(88px + var(--space-4)); }
  .fab, .fab-menu { right: var(--space-6); }
}
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  padding: var(--space-5);
  box-shadow: var(--shadow-md);
  transition: transform .18s var(--ease-spring), box-shadow .18s var(--ease-spring), border-color .18s ease;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,0) 40%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
@media (hover: hover) {
  a[style*="cursor:pointer"]:hover, .card[style*="cursor:pointer"]:hover { box-shadow: var(--shadow-lg); }
}
.card[style*="cursor:pointer"]:active, .list-row[style*="cursor:pointer"]:active { transform: scale(.985); }

.section-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  margin: var(--space-6) 0 var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title:first-child { margin-top: 0; }

/* Net worth hero */
.hero-metric { position: relative; margin-bottom: var(--space-5); overflow: hidden; box-shadow: var(--shadow-glow); }
.hero-metric .label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
.hero-metric .value {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-top: var(--space-1);
  background: linear-gradient(100deg, var(--text) 30%, var(--primary) 65%, var(--text) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-metric::after {
  content: '';
  position: absolute;
  top: -50%; left: 0;
  width: 45%; height: 200%;
  background: linear-gradient(75deg, transparent, rgba(var(--primary-rgb), .16), transparent);
  animation: shimmerSweep 3.2s ease-in-out .4s 1;
  pointer-events: none;
}
.hero-breakdown {
  display: flex;
  gap: var(--space-5);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
}
.hero-breakdown div .k { font-size: 12px; color: var(--text-secondary); }
.hero-breakdown div .v { font-size: 15px; font-weight: 700; margin-top: 2px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }

.stat-card .k { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
.stat-card .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-top: var(--space-1); }
.stat-card.positive .v { color: var(--positive); }
.stat-card.negative .v { color: var(--negative); }

.list-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border);
  transition: opacity .15s ease;
}
.list-row:last-child { border-bottom: none; }
.list-row[style*="cursor:pointer"]:active { opacity: .7; }

.row-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  background: var(--surface-2);
}
.row-icon svg { width: 20px; height: 20px; }
.inline-icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.inline-icon svg { width: 100%; height: 100%; display: block; }
.chev { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.chev svg { width: 100%; height: 100%; display: block; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 14px; font-weight: 600; }
.row-sub { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.row-value { font-weight: 700; font-size: 14px; white-space: nowrap; }
.section-title .st-label { display: inline-flex; align-items: center; gap: 8px; }
.section-title .st-icon { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; color: var(--primary); flex-shrink: 0; }
.section-title .st-icon svg { width: 100%; height: 100%; }
.row-value.income { color: var(--positive); }
.row-value.expense { color: var(--negative); }

.empty-state {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  color: var(--text-secondary);
}
.empty-state .glyph {
  font-size: 32px;
  margin-bottom: var(--space-3);
  display: inline-block;
  animation: floatGlyph 3.6s ease-in-out infinite;
}
.empty-state p { font-size: 13px; line-height: 1.5; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 13px var(--space-5);
  border-radius: var(--radius-m);
  font-weight: 700;
  font-size: 14px;
  width: 100%;
}
.btn-primary { background: var(--primary); color: var(--background); box-shadow: 0 6px 16px -6px rgba(var(--primary-rgb), .45); }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: rgba(255,107,107,0.12); color: var(--negative); }
.btn-ghost { color: var(--text-secondary); }
.btn { transition: transform .16s var(--ease-spring), box-shadow .16s ease, opacity .16s ease; }
.btn:active { transform: scale(0.97); opacity: .92; }

.field { margin-bottom: var(--space-4); }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: var(--space-2); }

<script>
// Blocco totale dello zoom: pinch-to-zoom (gesture Safari) e doppio tap.
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let __lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();
  __lastTouchEnd = now;
}, { passive: false });

<script>

// ---- storage/storage.js ----
// Storage Layer — abstracts persistence so the rest of the app never touches
// localStorage directly. Swapping to IndexedDB later only means rewriting
// this file's internals; every caller keeps working.

const DB_KEY = 'financehub:data';
const DB_VERSION = 1;

function safeParse(raw, fallback) {
  if (!raw) return fallback;
  try {
    return JSON.parse(raw);
  } catch (e) {
    console.error('[Storage] Corrupted data, falling back to defaults.', e);
    return fallback;
  }
}

const Storage = {
  /** Read the whole app data object. Returns null if nothing stored yet. */
  get() {
    const raw = localStorage.getItem(DB_KEY);
    return safeParse(raw, null);
  },

  /** Overwrite the whole app data object. */
  set(data) {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('[Storage] Write failed (quota exceeded?).', e);
      return false;
    }
  },

  /** Functional partial update: update(draft => { draft.settings.x = 1 }) */
  update(mutator) {
    const data = this.get();
    if (!data) return null;
    mutator(data);
    data.settings.updatedAt = new Date().toISOString();
    this.set(data);
    return data;
  },

  remove() {
    localStorage.removeItem(DB_KEY);
  },

  /** Full JSON backup, ready to download. */
  backup() {
    const data = this.get();
    return JSON.stringify({ dbVersion: DB_VERSION, exportedAt: new Date().toISOString(), data }, null, 2);
  },

  /** Restore from a backup JSON string. mode: 'replace' | 'merge' */
  restore(jsonString, mode = 'replace') {
    let parsed;
    try {
      parsed = JSON.parse(jsonString);
    } catch (e) {
      return { ok: false, error: 'File non valido: JSON malformato.' };
    }
    const incoming = parsed.data || parsed; // tolerate raw appData too
    if (!incoming || typeof incoming !== 'object' || !incoming.settings) {
      return { ok: false, error: 'Struttura dati non riconosciuta.' };
    }
    if (mode === 'replace') {
      this.set(incoming);
      return { ok: true };
    }
    // merge: keep existing, append arrays by id, prefer incoming settings/customization
    const current = this.get() || incoming;
    const arrayKeys = ['accounts', 'tags', 'transactions', 'transfers', 'cycles', 'inventory', 'budgets', 'goals', 'recurrences'];
    arrayKeys.forEach(k => {
      const existingIds = new Set((current[k] || []).map(x => x.id));
      const merged = [...(current[k] || [])];
      (incoming[k] || []).forEach(item => {
        if (!existingIds.has(item.id)) merged.push(item);
      });
      current[k] = merged;
    });
    current.settings = { ...current.settings, ...incoming.settings };
    current.customization = { ...current.customization, ...incoming.customization };
    current.modules = { ...current.modules, ...incoming.modules };
    this.set(current);
    return { ok: true };
  },
};


// ---- core/utils.js ----
function uid() {
  if (crypto?.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}

function nowISO() {
  return new Date().toISOString();
}

let currencyCode = 'EUR';
let localeCode = 'it-IT';

function configureFormat(currency, locale) {
  currencyCode = currency || 'EUR';
  localeCode = locale || 'it-IT';
}

function formatMoney(amount, opts = {}) {
  const n = Number(amount) || 0;
  const formatter = new Intl.NumberFormat(localeCode, {
    style: 'currency',
    currency: currencyCode,
    maximumFractionDigits: opts.compact ? 0 : 2,
    minimumFractionDigits: opts.compact ? 0 : 2,
  });
  return formatter.format(n);
}

function formatDate(iso, opts = {}) {
  if (!iso) return '';
  const d = new Date(iso);
  return new Intl.DateTimeFormat(localeCode, opts.style === 'long'
    ? { day: 'numeric', month: 'long', year: 'numeric' }
    : { day: '2-digit', month: 'short' }
  ).format(d);
}

function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.max(0, Math.round(ms / 86400000));
}

function debounce(fn, wait = 250) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/**
 * Mobile browsers frequently freeze CSS animations on fixed, off-screen-ish
 * decorative elements after the tab/app is backgrounded and resumed (a known
 * WebKit/Chrome quirk). This forces each one to restart cleanly by clearing
 * and re-applying its animation on the next frame.
 */
function restartAmbientAnimations() {
  document.querySelectorAll('.bg-aurora-a, .bg-aurora-b, .bg-stars').forEach(node => {
    node.style.animation = 'none';
    requestAnimationFrame(() => {
      void node.offsetHeight; // force reflow
      node.style.animation = '';
    });
  });
}

/** Animates a number element from 0 to `target`, formatting each frame with `formatter`. */
function animateCountUp(node, target, formatter = (n) => formatMoney(n), duration = 900) {
  if (!node) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    node.textContent = formatter(target);
    return;
  }
  const start = performance.now();
  const from = 0;
  function frame(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
    node.textContent = formatter(from + (target - from) * eased);
    if (p < 1) requestAnimationFrame(frame);
    else node.textContent = formatter(target);
  }
  requestAnimationFrame(frame);
}

function toast(message) {
  let node = document.getElementById('toast');
  if (!node) {
    node = document.createElement('div');
    node.id = 'toast';
    node.className = 'toast';
    document.body.appendChild(node);
  }
  node.textContent = message;
  node.classList.add('visible');
  clearTimeout(node._t);
  node._t = setTimeout(() => node.classList.remove('visible'), 2200);
}


// ---- core/state.js ----
// The canonical shape of appData (see spec §40). Only modules that are
// actually implemented in this build ship with real services/views — the
// rest of the schema is reserved so future modules can be added without a
// breaking migration.
function defaultAppData() {
  return {
    version: 1,
    onboarded: false,
    settings: {
      appName: 'Finance Hub',
      theme: 'dark',
      density: 'default',
      primaryColor: '#C8A84B',
      currency: 'EUR',
      locale: 'it-IT',
      dashboardLayout: ['netWorth', 'cashflow', 'budgetAlerts', 'cycles', 'accounts', 'recent', 'insights'],
      dashboardHidden: [],
      pinHash: null,
      autoLock: false,
      createdAt: nowISO(),
      updatedAt: nowISO(),
    },
    modules: {
      finance: { enabled: true },
      accounts: { enabled: true },
      transfers: { enabled: true },
      investments: { enabled: false },
      cycles: { enabled: false },
      inventory: { enabled: false },
      budgets: { enabled: false },
      goals: { enabled: false },
      recurrences: { enabled: false },
      calendar: { enabled: false },
      insights: { enabled: false },
      forecasts: { enabled: false },
    },
    customization: {
      labels: {},   // e.g. { investments: "Business" }
      icons: {},
      colors: {},
    },
    accounts: [],
    tags: [],
    transactions: [],
    transfers: [],
    cycles: [],
    inventory: [],
    budgets: [],
    goals: [],
    recurrences: [],
    investments: [],
  };
}

class Store {
  constructor() {
    this.data = Storage.get() || defaultAppData();
    this._listeners = new Set();
    configureFormat(this.data.settings.currency, this.data.settings.locale);
  }

  get() {
    return this.data;
  }

  /** Mutate state via a function, persist, then notify subscribers. */
  commit(mutator) {
    mutator(this.data);
    this.data.settings.updatedAt = nowISO();
    Storage.set(this.data);
    configureFormat(this.data.settings.currency, this.data.settings.locale);
    this._emit();
  }

  subscribe(fn) {
    this._listeners.add(fn);
    return () => this._listeners.delete(fn);
  }

  _emit() {
    this._listeners.forEach(fn => fn(this.data));
  }

  reset() {
    this.data = defaultAppData();
    Storage.set(this.data);
    this._emit();
  }
}

const store = new Store();


// ---- core/customization.js ----
// Default Italian labels for every renameable concept in the app.
// t(key) returns the user's custom label if set, otherwise this default.
const DEFAULT_LABELS = {
  finance: 'Finanze',
  accounts: 'Account',
  transfers: 'Trasferimenti',
  investments: 'Investimenti',
  cycles: 'Cicli',
  inventory: 'Inventario',
  budgets: 'Budget',
  goals: 'Obiettivi',
  recurrences: 'Ricorrenze',
  calendar: 'Calendario',
  insights: 'Insights',
  forecasts: 'Previsioni',
  income: 'Entrata',
  expense: 'Uscita',
  transfer: 'Trasferimento',
  netWorth: 'Patrimonio totale',
  cashflow: 'Cashflow',
  newCycle: 'Nuovo ciclo',
  newProduct: 'Nuovo prodotto',
  newGoal: 'Nuovo obiettivo',
  lockedCapital: 'Capitale bloccato',
  activeCycles: 'Cicli attivi',
};

function t(key) {
  const custom = store.get().customization.labels?.[key];
  return custom && custom.trim() ? custom : (DEFAULT_LABELS[key] || key);
}

function setLabel(key, value) {
  store.commit(d => {
    d.customization.labels[key] = value;
  });
}

const PRESETS = {
  minimal: {
    space: 'default',
    radiusS: '6px', radiusM: '10px', radiusL: '12px',
    fontDisplay: "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif",
    shadows: 'none',
    ambient: 0.3,
    desc: 'Bordi sottili, zero ombre e zero decorazioni: la versione più leggera e diretta.',
  },
  premium: {
    space: 'comfortable',
    radiusS: '10px', radiusM: '16px', radiusL: '22px',
    fontDisplay: "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif",
    shadows: 'full',
    ambient: 1,
    desc: 'Ombre profonde, bagliore dorato e sfondo animato: l\'esperienza più ricca.',
  },
  classic: {
    space: 'default',
    radiusS: '4px', radiusM: '6px', radiusL: '8px',
    fontDisplay: "'Iowan Old Style', 'Palatino Linotype', Georgia, serif",
    shadows: 'none',
    ambient: 0,
    desc: 'Serif nei titoli, angoli squadrati, nessun effetto: uno stile sobrio e senza tempo.',
  },
  compact: {
    space: 'compact',
    radiusS: '6px', radiusM: '10px', radiusL: '12px',
    fontDisplay: "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif",
    shadows: 'low',
    ambient: 0.2,
    desc: 'Densità alta e decorazioni ridotte al minimo: pensato per vedere più dati a schermo.',
  },
};

const THEME_PRESETS = PRESETS;

/** Applies the current settings to CSS custom properties on <html>. */
function applyTheme() {
  const { settings } = store.get();
  const root = document.documentElement;
  root.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
  root.setAttribute('data-density', settings.density === 'default' ? '' : settings.density);
  root.style.setProperty('--primary', settings.primaryColor);
  const rgb = hexToRgb(settings.primaryColor);
  if (rgb) root.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
  document.title = settings.appName;
  const nameNode = document.getElementById('app-name');
  if (nameNode) nameNode.textContent = settings.appName;
  const manifestLink = document.getElementById('manifest-link');
  if (manifestLink) manifestLink.setAttribute('href', 'manifest.json');

  const presetName = settings.activePreset && PRESETS[settings.activePreset] ? settings.activePreset : 'premium';
  const preset = PRESETS[presetName];
  root.setAttribute('data-preset', presetName);
  root.setAttribute('data-shadows', preset.shadows);
  root.style.setProperty('--radius-s', preset.radiusS);
  root.style.setProperty('--radius-m', preset.radiusM);
  root.style.setProperty('--radius-l', preset.radiusL);
  root.style.setProperty('--font-display', preset.fontDisplay);
  root.style.setProperty('--ambient-opacity', preset.ambient);
}

function applyPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  store.commit(d => {
    d.settings.density = preset.space;
    d.settings.activePreset = name;
  });
  applyTheme();
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return null;
  return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
}


// ---- core/module-manager.js ----
// Registry of every module Finance Hub knows about. `builtin: true` modules
// are core to this build (finance/accounts) and are not user-toggleable yet
// because nothing else in the app works without them. Modules with
// `implemented: false` are part of the reserved data schema but have no
// service/view shipped in this build — they are intentionally left OUT of
// the Moduli page and the navigation so nothing fake is ever shown.
const REGISTRY = {
  finance: {
    id: 'finance', labelKey: 'finance', icon: '💰', dependencies: [], builtin: true, implemented: true,
    nav: { route: 'finance', order: 2 },
  },
  accounts: {
    id: 'accounts', labelKey: 'accounts', icon: '🏦', dependencies: [], builtin: true, implemented: true,
    nav: { route: 'accounts', order: 3 },
  },
  transfers: {
    id: 'transfers', labelKey: 'transfers', icon: '↔️', dependencies: ['accounts'], builtin: false, implemented: true,
    nav: null, // surfaced as a quick action + inside Accounts, not its own nav tab
  },
  investments: {
    id: 'investments', labelKey: 'investments', icon: '📦', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'investments', order: 3.5 },
  },
  cycles: {
    id: 'cycles', labelKey: 'cycles', icon: '🔄', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'cycles', order: 4 },
  },
  inventory: {
    id: 'inventory', labelKey: 'inventory', icon: '📦', dependencies: ['cycles'], builtin: false, implemented: true,
    nav: { route: 'inventory', order: 5 },
  },
  budgets: {
    id: 'budgets', labelKey: 'budgets', icon: '💸', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'budgets', order: 6 },
  },
  goals: {
    id: 'goals', labelKey: 'goals', icon: '🎯', dependencies: [], builtin: false, implemented: true,
    nav: { route: 'goals', order: 7 },
  },
  recurrences: {
    id: 'recurrences', labelKey: 'recurrences', icon: '🔁', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'recurrences', order: 8 },
  },
  calendar: {
    id: 'calendar', labelKey: 'calendar', icon: '📅', dependencies: [], builtin: false, implemented: true,
    nav: { route: 'calendar', order: 9.3 },
  },
  insights: {
    id: 'insights', labelKey: 'insights', icon: '🧠', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'insights', order: 9 },
  },
  forecasts: {
    id: 'forecasts', labelKey: 'forecasts', icon: '🔮', dependencies: ['finance'], builtin: false, implemented: true,
    nav: { route: 'forecasts', order: 9.6 },
  },
};

const ModuleManager = {
  registry: REGISTRY,

  isEnabled(id) {
    return !!store.get().modules[id]?.enabled;
  },

  /** Modules that are both implemented in this build AND currently enabled. */
  getActiveModules() {
    return Object.values(REGISTRY).filter(m => m.implemented && this.isEnabled(m.id));
  },

  /** Only modules with real UI shipped — what the Moduli page should list. */
  getManageableModules() {
    return Object.values(REGISTRY).filter(m => m.implemented && !m.builtin);
  },

  getDependencies(id) {
    return REGISTRY[id]?.dependencies || [];
  },

  checkDependencies(id) {
    return this.getDependencies(id).filter(dep => !this.isEnabled(dep));
  },

  enableModule(id) {
    const missing = this.checkDependencies(id);
    if (missing.length) {
      store.commit(d => missing.forEach(dep => { d.modules[dep].enabled = true; }));
    }
    store.commit(d => { d.modules[id].enabled = true; });
  },

  disableModule(id) {
    // Disabling never deletes data — only flips the flag the rest of the
    // app reads. Also cascade-disable anything that depends on this module.
    const dependents = Object.values(REGISTRY).filter(m => m.dependencies.includes(id) && this.isEnabled(m.id));
    store.commit(d => {
      d.modules[id].enabled = false;
      dependents.forEach(m => { d.modules[m.id].enabled = false; });
    });
    return dependents;
  },

  getNavigationItems() {
    const home = { route: 'home', icon: 'home', label: 'Home', order: 0 };
    const settings = { route: 'settings', icon: 'settings', label: 'Impostazioni', order: 999 };
    const CORE = ['finance', 'accounts'];
    const navModules = this.getActiveModules().filter(m => m.nav);
    const coreItems = navModules
      .filter(m => CORE.includes(m.id))
      .map(m => ({ route: m.nav.route, icon: m.id, label: t(m.labelKey), order: m.nav.order }));
    const extra = navModules.filter(m => !CORE.includes(m.id));

    const items = [home, ...coreItems];
    if (extra.length === 1) {
      const m = extra[0];
      items.push({ route: m.nav.route, icon: m.id, label: t(m.labelKey), order: m.nav.order });
    } else if (extra.length > 1) {
      items.push({ route: 'more', icon: 'more', label: 'Altro', order: 50 });
    }
    items.push(settings);
    return items.sort((a, b) => a.order - b.order);
  },

  /** Modules bundled into the "Altro" hub page when there isn't room for a dedicated tab. */
  getExtraNavModules() {
    const CORE = ['finance', 'accounts'];
    const navModules = this.getActiveModules().filter(m => m.nav);
    const extra = navModules.filter(m => !CORE.includes(m.id)).sort((a, b) => a.nav.order - b.nav.order);
    return extra.length > 1 ? extra : [];
  },

  getQuickActions() {
    const actions = [];
    if (this.isEnabled('finance')) {
      actions.push({ id: 'add-income', label: `+ ${t('income')}`, icon: '➕', route: 'finance', payload: { type: 'income' } });
      actions.push({ id: 'add-expense', label: `- ${t('expense')}`, icon: '➖', route: 'finance', payload: { type: 'expense' } });
    }
    if (this.isEnabled('transfers') && store.get().accounts.filter(a => !a.archived).length >= 2) {
      actions.push({ id: 'add-transfer', label: t('transfer'), icon: '↔️', route: 'accounts', payload: { openTransfer: true } });
    }
    if (this.isEnabled('cycles')) {
      actions.push({ id: 'add-cycle', label: t('newCycle'), icon: '📦', route: 'cycles', payload: { openNew: true } });
    }
    if (this.isEnabled('inventory')) {
      actions.push({ id: 'add-product', label: t('newProduct'), icon: '📋', route: 'inventory', payload: { openNew: true } });
    }
    if (this.isEnabled('goals')) {
      actions.push({ id: 'add-goal', label: t('newGoal'), icon: '🎯', route: 'goals', payload: { openNew: true } });
    }
    return actions;
  },
};


// ---- core/router.js ----
const routes = {};
let currentParams = {};

function registerRoute(name, renderFn) {
  routes[name] = renderFn;
}

function navigate(name, params = {}) {
  currentParams = params;
  const query = Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
  window.location.hash = `#/${name}${query}`;
}

function getParams() {
  return currentParams;
}

function parseHash() {
  const hash = window.location.hash.replace(/^#\//, '');
  const [name, query] = hash.split('?');
  const params = {};
  if (query) new URLSearchParams(query).forEach((v, k) => { params[k] = v; });
  return { name: name || 'home', params };
}

async function renderCurrentRoute() {
  const { name, params } = parseHash();
  currentParams = params;
  const fn = routes[name] || routes['home'];
  const main = document.getElementById('view-root');
  main.setAttribute('aria-busy', 'true');
  await fn(main, params);
  main.setAttribute('aria-busy', 'false');
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === name);
  });
  window.scrollTo(0, 0);
  // Replay the entrance animation on every navigation (restart via reflow).
  main.classList.remove('route-enter');
  void main.offsetWidth;
  main.classList.add('route-enter');
}

function startRouter() {
  window.addEventListener('hashchange', renderCurrentRoute);
  if (!window.location.hash) window.location.hash = '#/home';
  renderCurrentRoute();
}

// ---- services/finance.js ----
const FinanceService = {
  listTransactions(filter = {}) {
    let items = [...store.get().transactions];
    if (filter.type) items = items.filter(t => t.type === filter.type);
    if (filter.accountId) items = items.filter(t => t.accountId === filter.accountId);
    if (filter.tagId) items = items.filter(t => t.tagId === filter.tagId);
    if (filter.from) items = items.filter(t => t.date >= filter.from);
    if (filter.to) items = items.filter(t => t.date <= filter.to);
    if (filter.query) {
      const q = filter.query.toLowerCase();
      items = items.filter(t => (t.note || '').toLowerCase().includes(q));
    }
    return items.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  },

  addTransaction({ type, amount, accountId, tagId, note, date }) {
    const tx = {
      id: uid(),
      type, // 'income' | 'expense'
      amount: Math.abs(Number(amount)) || 0,
      accountId,
      tagId: tagId || null,
      cycleId: null,
      note: note || '',
      date: date || nowISO().slice(0, 10),
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.transactions.push(tx));
    return tx;
  },

  updateTransaction(id, patch) {
    store.commit(d => {
      const tx = d.transactions.find(t => t.id === id);
      if (tx) Object.assign(tx, patch, { updatedAt: nowISO() });
    });
  },

  deleteTransaction(id) {
    store.commit(d => { d.transactions = d.transactions.filter(t => t.id !== id); });
  },

  // --- Tags ---
  listTags() {
    return store.get().tags;
  },

  getOrCreateTag(name, { icon = '🏷️', color = '#8B93A7' } = {}) {
    const clean = name.trim();
    if (!clean) return null;
    const existing = store.get().tags.find(t => t.name.toLowerCase() === clean.toLowerCase());
    if (existing) return existing;
    const tag = { id: uid(), name: clean, icon, color, createdAt: nowISO() };
    store.commit(d => d.tags.push(tag));
    return tag;
  },

  deleteTag(id) {
    store.commit(d => {
      d.tags = d.tags.filter(t => t.id !== id);
      d.transactions.forEach(t => { if (t.tagId === id) t.tagId = null; });
    });
  },

  tagStats(tagId) {
    const txs = store.get().transactions.filter(t => t.tagId === tagId);
    const income = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    return { income, expense, profit: income - expense, count: txs.length };
  },
};


// ---- services/recurrences.js ----
const RECURRENCE_FREQUENCIES = [
  { id: 'daily', label: 'Giornaliera' },
  { id: 'weekly', label: 'Settimanale' },
  { id: 'monthly', label: 'Mensile' },
  { id: 'yearly', label: 'Annuale' },
];

function nextOccurrence(dateStr, frequency, interval = 1) {
  const d = new Date(dateStr + 'T00:00:00');
  if (frequency === 'daily') d.setDate(d.getDate() + interval);
  else if (frequency === 'weekly') d.setDate(d.getDate() + 7 * interval);
  else if (frequency === 'monthly') d.setMonth(d.getMonth() + interval);
  else if (frequency === 'yearly') d.setFullYear(d.getFullYear() + interval);
  return d.toISOString().slice(0, 10);
}

const RecurrencesService = {
  list() {
    return store.get().recurrences.sort((a, b) => (a.nextDate || '').localeCompare(b.nextDate || ''));
  },

  get(id) {
    return store.get().recurrences.find(r => r.id === id);
  },

  create({ type, amount, accountId, tagId, note, frequency, interval, startDate, endDate }) {
    const rec = {
      id: uid(),
      type,
      amount: Math.abs(Number(amount)) || 0,
      accountId,
      tagId: tagId || null,
      note: note || '',
      frequency: frequency || 'monthly',
      interval: Math.max(1, Number(interval) || 1),
      nextDate: startDate || nowISO().slice(0, 10),
      endDate: endDate || null,
      active: true,
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.recurrences.push(rec));
    return rec;
  },

  update(id, patch) {
    store.commit(d => {
      const r = d.recurrences.find(x => x.id === id);
      if (r) Object.assign(r, patch, { updatedAt: nowISO() });
    });
  },

  toggleActive(id) {
    const r = this.get(id);
    if (r) this.update(id, { active: !r.active });
  },

  delete(id) {
    store.commit(d => { d.recurrences = d.recurrences.filter(r => r.id !== id); });
  },

  /**
   * Idempotent: walks each active recurrence from its stored nextDate up to
   * today, creating exactly one transaction per missed occurrence and
   * persisting the advanced nextDate — safe to call on every app launch.
   */
  processAll() {
    const today = nowISO().slice(0, 10);
    let generated = 0;
    const recs = store.get().recurrences.filter(r => r.active);

    recs.forEach(rec => {
      let cursor = rec.nextDate;
      let guard = 0;
      while (cursor <= today && (!rec.endDate || cursor <= rec.endDate) && guard < 500) {
        FinanceService.addTransaction({
          type: rec.type,
          amount: rec.amount,
          accountId: rec.accountId,
          tagId: rec.tagId,
          note: rec.note,
          date: cursor,
        });
        generated++;
        cursor = nextOccurrence(cursor, rec.frequency, rec.interval);
        guard++;
      }
      const shouldDeactivate = rec.endDate && cursor > rec.endDate;
      this.update(rec.id, { nextDate: cursor, active: !shouldDeactivate });
    });

    return generated;
  },
};


// ---- core/security.js ----
async function hashPin(pin) {
  const enc = new TextEncoder().encode('financehub-salt:' + pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function setPin(pin) {
  const hash = await hashPin(pin);
  store.commit(d => { d.settings.pinHash = hash; });
}

function clearPin() {
  store.commit(d => { d.settings.pinHash = null; d.settings.autoLock = false; });
}

function isPinSet() {
  return !!store.get().settings.pinHash;
}

async function verifyPin(pin) {
  const hash = await hashPin(pin);
  return hash === store.get().settings.pinHash;
}

/** Renders a full-screen PIN pad over #lock-root. Calls onUnlock() on success. */
function showLock(onUnlock) {
  const root = document.getElementById('lock-root');
  root.style.display = 'flex';
  let entered = '';

  function render() {
    root.innerHTML = `
      <div style="text-align:center;width:100%;max-width:320px">
        <div style="font-size:32px;margin-bottom:8px">🔒</div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:24px">Inserisci il PIN</div>
        <div id="lock-dots" style="display:flex;justify-content:center;gap:12px;margin-bottom:28px">
          ${Array.from({ length: 6 }).map((_, i) => `<span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:${i < entered.length ? 'var(--primary)' : 'transparent'}"></span>`).join('')}
        </div>
        <div id="lock-error" style="color:var(--negative);font-size:12px;height:16px;margin-bottom:8px"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn btn-secondary" data-n="${n}" style="height:56px;font-size:18px">${n}</button>`).join('')}
          <div></div>
          <button class="btn btn-secondary" data-n="0" style="height:56px;font-size:18px">0</button>
          <button class="btn btn-ghost" id="lock-del" style="height:56px">⌫</button>
        </div>
      </div>
    `;
    root.querySelectorAll('[data-n]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (entered.length >= 6) return;
        entered += btn.dataset.n;
        render();
        if (entered.length >= 4) {
          const ok = await verifyPin(entered);
          if (ok) {
            root.style.display = 'none';
            onUnlock();
          } else if (entered.length === 6) {
            root.querySelector('#lock-error').textContent = 'PIN errato, riprova.';
            entered = '';
            setTimeout(render, 300);
          }
        }
      });
    });
    root.querySelector('#lock-del').addEventListener('click', () => { entered = entered.slice(0, -1); render(); });
  }
  render();
}

const AccountsService = {

      .sort((a, b) => a.order - b.order);

    const account = {
      id: uid(),
      name: name.trim(),
      type,
      customType: type === 'custom' ? customType : null,
      icon: icon || '🏦',
      color: color || '#C8A84B',
      initialBalance: Number(initialBalance) || 0,
      note: note || '',

      order: store.get().accounts.length,
      createdAt: nowISO(),
      updatedAt: nowISO(),

      const acc = d.accounts.find(a => a.id === id);

    this.update(id, { archived: false });
  },

  /** Computed balance = initial + income - expense (on this account) + transfers in - transfers out. */
  balance(id) {
    const data = store.get();
    const acc = data.accounts.find(a => a.id === id);
    if (!acc) return 0;
    let bal = acc.initialBalance;
    data.transactions.forEach(t => {
      if (t.accountId !== id) return;
      bal += t.type === 'income' ? t.amount : -t.amount;
    });
    data.transfers.forEach(tr => {
      if (tr.fromAccountId === id) bal -= tr.amount;
      if (tr.toAccountId === id) bal += tr.amount;
    });
    return bal;
  },

  totalBalance({ includeArchived = false } = {}) {
    return this.list({ includeArchived }).reduce((sum, a) => sum + this.balance(a.id), 0);
  },
};

const ONBOARD_COLORS = ['#C8A84B', '#3DD68C', '#5B8DEF', '#FF6B6B', '#F5B942', '#B98BE0'];

function renderOnboarding(onDone) {
  const root = document.getElementById('onboarding-root');
  root.style.display = 'flex';
  document.getElementById('app').style.display = 'none';

  let step = 1;
  let chosenColor = '#C8A84B';
  let chosenPreset = 'premium';

  function render() {
    root.innerHTML = stepMarkup(step, chosenColor, chosenPreset);
    wire();
  }

  function wire() {
    root.querySelectorAll('[data-color]').forEach(sw => sw.addEventListener('click', () => {
      chosenColor = sw.dataset.color;
      render();
    }));
    root.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => {
      chosenPreset = btn.dataset.preset;
      render();
    }));
    const next = root.querySelector('#ob-next');
    if (next) next.addEventListener('click', () => {
      if (step === 1) {
        const name = root.querySelector('#ob-name').value.trim();
        const currency = root.querySelector('#ob-currency').value;
        store.commit(d => {
          d.settings.appName = name || 'Finance Hub';
          d.settings.currency = currency;
        });
      }
      if (step === 2) {
        store.commit(d => { d.settings.primaryColor = chosenColor; });
        applyTheme();
      }
      if (step === 3) {
        applyPreset(chosenPreset);
      }
      if (step < 4) { step++; render(); }
    });
    const finish = root.querySelector('#ob-finish');
    if (finish) finish.addEventListener('click', () => {
      const name = root.querySelector('#ob-acc-name').value.trim();
      if (name) {
        AccountsService.create({ name, type: 'cash', icon: '💶', color: chosenColor, initialBalance: parseFloat(root.querySelector('#ob-acc-balance').value) || 0 });
      }
      store.commit(d => { d.onboarded = true; });
      root.style.display = 'none';
      document.getElementById('app').style.display = '';
      toast('Benvenuto in ' + store.get().settings.appName + '!');
      onDone();
    });
    const skip = root.querySelector('#ob-skip');
    if (skip) skip.addEventListener('click', () => finish.click());
    const back = root.querySelector('#ob-back');
    if (back) back.addEventListener('click', () => { step--; render(); });
  }

  render();
}

const CYCLE_STATUSES = [
  { id: 'ACTIVE', label: 'Attivo', color: '#5B8DEF' },
  { id: 'SELLING', label: 'In vendita', color: '#F5B942' },
  { id: 'PARTIAL', label: 'Parzialmente venduto', color: '#B98BE0' },
  { id: 'COMPLETED', label: 'Completato', color: '#3DD68C' },
  { id: 'CANCELLED', label: 'Annullato', color: '#8B93A7' },
];

const CyclesService = {
  list({ status } = {}) {
    let items = [...store.get().cycles];
    if (status) items = items.filter(c => c.status === status);
    return items.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
  },

  get(id) {
    return store.get().cycles.find(c => c.id === id);
  },

  create({ name, tagId, platform, startDate, estimatedRevenue, quantityPurchased, notes }) {
    const cycle = {
      id: uid(),
      name: name.trim(),
      tagId: tagId || null,
      status: 'ACTIVE',
      image: null,
      startDate: startDate || nowISO().slice(0, 10),
      endDate: null,
      estimatedRevenue: Number(estimatedRevenue) || 0,
      finalRevenue: null,
      quantityPurchased: Number(quantityPurchased) || 1,
      quantitySold: 0,
      platform: platform || '',
      notes: notes || '',
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.cycles.push(cycle));
    return cycle;
  },

  update(id, patch) {
    store.commit(d => {
      const c = d.cycles.find(x => x.id === id);
      if (c) Object.assign(c, patch, { updatedAt: nowISO() });
    });
  },

  setStatus(id, status) {
    const patch = { status };
    if (status === 'COMPLETED' || status === 'CANCELLED') {
      const c = this.get(id);
      patch.endDate = nowISO().slice(0, 10);
      if (status === 'COMPLETED' && (c.finalRevenue === null || c.finalRevenue === undefined)) {
        patch.finalRevenue = this.metrics(id).revenueCollected;
      }
    }
    this.update(id, patch);
  },

  delete(id) {
    store.commit(d => {
      d.cycles = d.cycles.filter(c => c.id !== id);
      d.transactions.forEach(t => { if (t.cycleId === id) t.cycleId = null; });
    });
  },

  /** Transactions linked to a cycle — costs are expenses, revenue is income. */
  transactions(id) {
    return store.get().transactions.filter(t => t.cycleId === id)
      .sort((a, b) => b.date.localeCompare(a.date));
  },

  metrics(id) {
    const cycle = this.get(id);
    if (!cycle) return null;
    const txs = this.transactions(id);
    const cost = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const revenueCollected = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const revenueEstimated = cycle.estimatedRevenue || 0;
    const revenueFinal = cycle.finalRevenue;

    const profitCurrent = revenueCollected - cost;
    const profitEstimated = revenueEstimated - cost;
    const profitFinal = revenueFinal !== null && revenueFinal !== undefined ? revenueFinal - cost : null;

    const roi = (profit) => (cost > 0 ? Math.round((profit / cost) * 1000) / 10 : null);

    const capitalRecovered = revenueCollected;
    const capitalLocked = Math.max(0, cost - revenueCollected);

    const endRef = cycle.endDate || nowISO().slice(0, 10);
    const holdingDays = daysBetween(cycle.startDate, endRef);

    return {
      cost,
      revenueCollected,
      revenueEstimated,
      revenueFinal,
      profitCurrent,
      profitEstimated,
      profitFinal,
      roiCurrent: roi(profitCurrent),
      roiEstimated: roi(profitEstimated),
      roiFinal: profitFinal !== null ? roi(profitFinal) : null,
      capitalRecovered,
      capitalLocked,
      holdingDays,
      isOpen: cycle.status !== 'COMPLETED' && cycle.status !== 'CANCELLED',
    };
  },

  totalLockedCapital() {
    return this.list().reduce((sum, c) => {
      const m = this.metrics(c.id);
      return sum + (m.isOpen ? m.capitalLocked : 0);
    }, 0);
  },

  activeCount() {
    return this.list().filter(c => c.status === 'ACTIVE' || c.status === 'SELLING' || c.status === 'PARTIAL').length;
  },
};


// ---- services/budgets.js ----
const BUDGET_PERIODS = [
  { id: 'weekly', label: 'Settimanale' },
  { id: 'monthly', label: 'Mensile' },
  { id: 'yearly', label: 'Annuale' },
  { id: 'custom', label: 'Personalizzato' },
];

function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function addMonths(dateStr, months) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}
function addYears(dateStr, years) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setFullYear(d.getFullYear() + years);
  return d.toISOString().slice(0, 10);
}

/** Returns the [start, end) of the CURRENT occurrence of a rolling budget period. */
function currentPeriodRange(budget) {
  const today = nowISO().slice(0, 10);
  if (budget.period === 'custom') {
    return { start: budget.startDate, end: budget.endDate || today };
  }
  const step = budget.period === 'weekly' ? (d => addDays(d, 7))
    : budget.period === 'yearly' ? (d => addYears(d, 1))
    : (d => addMonths(d, 1));
  let start = budget.startDate;
  let next = step(start);
  // advance until today sits inside [start, next)
  let guard = 0;
  while (next <= today && guard < 2000) {
    start = next;
    next = step(start);
    guard++;
  }
  return { start, end: next };
}

const BudgetsService = {
  list() {
    return store.get().budgets.sort((a, b) => a.name.localeCompare(b.name));
  },

  get(id) {
    return store.get().budgets.find(b => b.id === id);
  },

  create({ name, tagIds, amount, period, startDate, endDate }) {
    const budget = {
      id: uid(),
      name: name.trim(),
      tagIds: tagIds || [],
      amount: Number(amount) || 0,
      period: period || 'monthly',
      startDate: startDate || nowISO().slice(0, 10),
      endDate: period === 'custom' ? endDate : null,
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.budgets.push(budget));
    return budget;
  },

  update(id, patch) {
    store.commit(d => {
      const b = d.budgets.find(x => x.id === id);
      if (b) Object.assign(b, patch, { updatedAt: nowISO() });
    });
  },

  delete(id) {
    store.commit(d => { d.budgets = d.budgets.filter(b => b.id !== id); });
  },

  spent(id) {
    const budget = this.get(id);
    if (!budget) return 0;
    const { start, end } = currentPeriodRange(budget);
    const txs = store.get().transactions.filter(t =>
      t.type === 'expense' &&
      t.date >= start && t.date < end &&
      (budget.tagIds.length === 0 || budget.tagIds.includes(t.tagId))
    );
    return txs.reduce((s, t) => s + t.amount, 0);
  },

  status(id) {
    const budget = this.get(id);
    const spent = this.spent(id);
    const pct = budget.amount > 0 ? Math.round((spent / budget.amount) * 100) : 0;
    const remaining = budget.amount - spent;
    const level = pct >= 100 ? 'over' : pct >= 90 ? 'danger' : pct >= 80 ? 'warning' : 'ok';
    return { spent, remaining, pct, level, range: currentPeriodRange(budget) };
  },
};

      if (i) Object.assign(i, patch, { updatedAt: nowISO() });
    });
  },

  },

    return { profit, roi, capitalInvested: i.capitalInvested, currentValue: i.currentValue };
  },

    const items = this.list().filter(i => !i.closed);
    const invested = items.reduce((s, i) => s + i.capitalInvested, 0);
    const value = items.reduce((s, i) => s + i.currentValue, 0);
    return { invested, value, profit: value - invested, roi: invested > 0 ? Math.round(((value - invested) / invested) * 1000) / 10 : null };
  },
};


// ---- services/analytics.js ----
// Every derived financial number lives here so views never duplicate a
// calculation — matches spec §19 "Analytics Module".
const Analytics = {
  /** Patrimonio totale = liquidità (account) + valore investimenti + capitale bloccato nei cicli aperti. */
  netWorthBreakdown() {
    const liquidity = AccountsService.totalBalance();
    const investments = ModuleManager.isEnabled('investments') ? InvestmentsService.totals().value : 0;
    const lockedCapital = ModuleManager.isEnabled('cycles') ? CyclesService.totalLockedCapital() : 0;
    return { liquidity, investments, lockedCapital, total: liquidity + investments + lockedCapital };
  },

  calculateNetWorth() {
    return this.netWorthBreakdown().total;
  },

  _txInRange(days) {
    const data = store.get();
    const since = days ? new Date(Date.now() - days * 86400000).toISOString().slice(0, 10) : null;
    return data.transactions.filter(t => !since || t.date >= since);
  },

  calculateIncome(days = 30) {
    return this._txInRange(days).filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  },

  calculateExpenses(days = 30) {
    return this._txInRange(days).filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  },

  calculateCashflow(days = 30) {
    const income = this.calculateIncome(days);
    const expenses = this.calculateExpenses(days);
    return { income, expenses, net: income - expenses };
  },

  calculateSavingsRate(days = 30) {
    const { income, net } = this.calculateCashflow(days);
    if (!income) return 0;
    return Math.round((net / income) * 100);
  },
};


// ---- services/insights.js ----
function pctChange(current, previous) {
  if (!previous) return null;
  return Math.round(((current - previous) / previous) * 100);
}

const InsightsService = {
  generate() {
    const insights = [];
    const data = store.get();

    // Spend trend: last 30 days vs the 30 before that.
    const expensesNow = Analytics.calculateExpenses(30);
    const allExpenses = data.transactions.filter(t => t.type === 'expense');
    const since60 = new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10);
    const since30 = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    const expensesPrev = allExpenses.filter(t => t.date >= since60 && t.date < since30).reduce((s, t) => s + t.amount, 0);
    const change = pctChange(expensesNow, expensesPrev);
    if (change !== null && Math.abs(change) >= 5) {
      insights.push({
        icon: change < 0 ? '📉' : '📈',
        level: change < 0 ? 'good' : 'warning',
        text: change < 0
          ? `Le tue spese sono diminuite del ${Math.abs(change)}% rispetto ai 30 giorni precedenti.`
          : `Le tue spese sono aumentate del ${change}% rispetto ai 30 giorni precedenti.`,
      });
    }

    // Cashflow direction.
    const { net } = Analytics.calculateCashflow(30);
    if (data.transactions.length > 0) {
      insights.push({
        icon: net >= 0 ? '✅' : '⚠️',
        level: net >= 0 ? 'good' : 'warning',
        text: net >= 0
          ? `Cashflow positivo negli ultimi 30 giorni: +${formatMoney(net)}.`
          : `Cashflow negativo negli ultimi 30 giorni: ${formatMoney(net)}.`,
      });
    }

    // Best-performing tag by profit.
    const tags = FinanceService.listTags();
    if (tags.length) {
      const ranked = tags.map(tag => ({ tag, ...FinanceService.tagStats(tag.id) }))
        .filter(r => r.count > 0)
        .sort((a, b) => b.profit - a.profit);
      if (ranked.length && ranked[0].profit > 0) {
        const top = ranked[0];
        const totalProfit = ranked.reduce((s, r) => s + Math.max(0, r.profit), 0);
        const share = totalProfit > 0 ? Math.round((Math.max(0, top.profit) / totalProfit) * 100) : 0;
        insights.push({
          icon: '🔥',
          level: 'good',
          text: share >= 40
            ? `${top.tag.name} produce il ${share}% del tuo profitto totale.`
            : `${top.tag.name} è il tag più redditizio con ${formatMoney(top.profit)} di profitto.`,
        });
      }
    }

    // Locked capital (cycles).
    if (ModuleManager.isEnabled('cycles')) {
      const locked = CyclesService.totalLockedCapital();
      if (locked > 0) {
        insights.push({ icon: '📦', level: 'info', text: `Hai ${formatMoney(locked)} di capitale bloccato in cicli aperti.` });
      }
      const open = CyclesService.list().filter(c => c.status !== 'COMPLETED' && c.status !== 'CANCELLED');
      const stale = open.filter(c => CyclesService.metrics(c.id).holdingDays > 60);
      if (stale.length) {
        insights.push({ icon: '🐌', level: 'warning', text: `${stale.length} ciclo/i sono aperti da oltre 60 giorni: ${stale.map(c => c.name).slice(0, 2).join(', ')}.` });
      }
    }

    // Budget alerts.
    if (ModuleManager.isEnabled('budgets')) {
      BudgetsService.list().forEach(b => {
        const s = BudgetsService.status(b.id);
        if (s.level === 'over') insights.push({ icon: '🔴', level: 'danger', text: `Hai superato il budget "${b.name}" di ${formatMoney(-s.remaining)}.` });
        else if (s.level === 'danger') insights.push({ icon: '⚠️', level: 'warning', text: `Sei al ${s.pct}% del budget "${b.name}".` });
      });
    }

    if (!insights.length) {
      insights.push({ icon: '💡', level: 'info', text: 'Continua a registrare movimenti: più dati hai, più insight utili potrò generare.' });
    }

    return insights;
  },
};

async function renderHome(root) {
  const defs = getWidgetDefs();
  const s = store.get().settings;
  const layout = s.dashboardLayout && s.dashboardLayout.length ? s.dashboardLayout : Object.keys(defs);
  const hidden = new Set(s.dashboardHidden || []);

  const blocks = layout
    .filter(key => defs[key] && !hidden.has(key) && (!defs[key].moduleKey || ModuleManager.isEnabled(defs[key].moduleKey)))
    .map(key => defs[key].html())
    .filter(Boolean);

  // Any widget not yet present in a saved layout (e.g. after an update) still shows, appended at the end.
  Object.keys(defs).forEach(key => {
    if (!layout.includes(key) && !hidden.has(key) && (!defs[key].moduleKey || ModuleManager.isEnabled(defs[key].moduleKey))) {
      const html = defs[key].html();
      if (html) blocks.push(html);
    }
  });

  root.innerHTML = blocks.join('\n');
  root.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.nav));
  });

  const netWorthNode = root.querySelector('#net-worth-value');
  if (netWorthNode) animateCountUp(netWorthNode, parseFloat(netWorthNode.dataset.target) || 0);
}

// ---- core/sheet.js ----
let scrim, current;

function ensureScrim() {
  if (scrim) return scrim;
  scrim = el('<div class="overlay-scrim"></div>');
  document.body.appendChild(scrim);
  scrim.addEventListener('click', closeSheet);
  return scrim;
}

function openSheet(innerHtml, { onClose } = {}) {
  closeSheet();
  ensureScrim();
  const node = el(`<div class="sheet"><div class="sheet-handle"></div>${innerHtml}</div>`);
  document.body.appendChild(node);
  current = { node, onClose };
  requestAnimationFrame(() => {
    scrim.classList.add('visible');
    node.classList.add('visible');
  });
  return node;
}

function closeSheet() {
  if (!current) {
    if (scrim) scrim.classList.remove('visible');
    return;
  }
  const { node, onClose } = current;
  node.classList.remove('visible');
  scrim.classList.remove('visible');
  setTimeout(() => node.remove(), 220);
  current = null;
  if (onClose) onClose();
}

function openTransactionSheet(existing, presetType, presetCycleId, presetAmount, presetNote, presetAccountId) {
  const accounts = AccountsService.list();
  const tags = FinanceService.listTags();
  const cyclesEnabled = ModuleManager.isEnabled('cycles');
  const cycles = cyclesEnabled ? CyclesService.list().filter(c => c.status !== 'COMPLETED' && c.status !== 'CANCELLED' || c.id === existing?.cycleId) : [];
  const type = existing?.type || presetType || 'expense';
  const cycleId = existing ? existing.cycleId : (presetCycleId || '');
  const amountValue = existing ? existing.amount : (presetAmount !== undefined && presetAmount !== null ? presetAmount : '');
  const noteValue = existing ? existing.note : (presetNote || '');
  const accountIdValue = existing ? existing.accountId : (presetAccountId || '');

  if (!accounts.length) {
    toast('Crea prima un account per registrare un movimento.');
    return;
  }

  const node = openSheet(`
    <div class="sheet-title">${existing ? 'Modifica movimento' : 'Nuovo movimento'}</div>
    <div class="segmented" id="tx-type" style="margin-bottom:16px">
      <button data-v="income" class="${type === 'income' ? 'active' : ''}">${t('income')}</button>
      <button data-v="expense" class="${type === 'expense' ? 'active' : ''}">${t('expense')}</button>
    </div>
    <div class="field">
      <label>Importo</label>
      <input id="tx-amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${amountValue}" />
    </div>
    <div class="field">
      <label>Account</label>
      <select id="tx-account">
        ${accounts.map(a => `<option value="${a.id}" ${accountIdValue === a.id ? 'selected' : ''}>${a.icon} ${escapeAttr(a.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Tag (opzionale)</label>
      <input id="tx-tag" list="tag-list" placeholder="es. Cibo, Stipendio..." value="${existing ? (tags.find(t2 => t2.id === existing.tagId)?.name || '') : ''}" />
      <datalist id="tag-list">${tags.map(t2 => `<option value="${escapeAttr(t2.name)}"></option>`).join('')}</datalist>
    </div>
    <div class="field">
      <label>Data</label>
      <input id="tx-date" type="date" value="${existing ? existing.date : nowISO().slice(0, 10)}" />
    </div>
    ${cyclesEnabled ? `<div class="field">
      <label>${t('cycles')} (opzionale)</label>
      <select id="tx-cycle">
        <option value="">Nessuno</option>
        ${cycles.map(c => `<option value="${c.id}" ${cycleId === c.id ? 'selected' : ''}>${escapeAttr(c.name)}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="field">
      <label>Nota (opzionale)</label>
      <input id="tx-note" placeholder="Descrizione" value="${escapeAttr(noteValue)}" />
    </div>
    <button class="btn btn-primary" id="tx-save">Salva</button>
    ${existing ? '<button class="btn btn-danger" id="tx-delete" style="margin-top:10px">Elimina</button>' : ''}
  `);

  let currentType = type;
  node.querySelectorAll('#tx-type button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentType = btn.dataset.v;
      node.querySelectorAll('#tx-type button').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  node.querySelector('#tx-save').addEventListener('click', () => {
    const amount = parseFloat(node.querySelector('#tx-amount').value);
    if (!amount || amount <= 0) { toast('Inserisci un importo valido.'); return; }
    const accountId = node.querySelector('#tx-account').value;
    const tagName = node.querySelector('#tx-tag').value.trim();
    const date = node.querySelector('#tx-date').value || nowISO().slice(0, 10);
    const note = node.querySelector('#tx-note').value.trim();
    const tag = tagName ? FinanceService.getOrCreateTag(tagName) : null;
    const selectedCycleId = cyclesEnabled ? (node.querySelector('#tx-cycle').value || null) : (existing?.cycleId || null);

    if (existing) {
      FinanceService.updateTransaction(existing.id, { type: currentType, amount, accountId, tagId: tag?.id || null, date, note, cycleId: selectedCycleId });
      toast('Movimento aggiornato.');
    } else {
      const tx = FinanceService.addTransaction({ type: currentType, amount, accountId, tagId: tag?.id || null, date, note });
      if (selectedCycleId) FinanceService.updateTransaction(tx.id, { cycleId: selectedCycleId });
      toast('Movimento salvato.');
    }
    closeSheet();
    renderCurrentRoute();
  });

  if (existing) {
    node.querySelector('#tx-delete').addEventListener('click', () => {
      FinanceService.deleteTransaction(existing.id);
      closeSheet();
      toast('Movimento eliminato.');
      renderCurrentRoute();
    });
  }
}

// ---- services/transfers.js ----
// A transfer moves money between two accounts. It is deliberately NOT a
// transaction: it never touches income/expense totals or net worth.
const TransfersService = {
  list({ accountId } = {}) {
    let items = [...store.get().transfers];
    if (accountId) items = items.filter(t => t.fromAccountId === accountId || t.toAccountId === accountId);
    return items.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  },

  create({ fromAccountId, toAccountId, amount, date, note }) {
    if (fromAccountId === toAccountId) {
      throw new Error('Il conto di origine e destinazione devono essere diversi.');
    }
    const transfer = {
      id: uid(),
      fromAccountId,
      toAccountId,
      amount: Math.abs(Number(amount)) || 0,
      date: date || nowISO().slice(0, 10),
      note: note || '',
      createdAt: nowISO(),
    };
    store.commit(d => d.transfers.push(transfer));
    return transfer;
  },

  delete(id) {
    store.commit(d => { d.transfers = d.transfers.filter(t => t.id !== id); });
  },
};

function escapeAttr(s) {
  return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}


// ---- core/csv.js ----
function toCSV(rows, columns) {
  const escape = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const header = columns.map(c => escape(c.label)).join(',');
  const lines = rows.map(row => columns.map(c => escape(typeof c.value === 'function' ? c.value(row) : row[c.value])).join(','));
  return [header, ...lines].join('\n');
}

function downloadCSV(filename, csvString) {
  const blob = new Blob(['\uFEFF' + csvString], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function renderDashboardCard(node, root) {
  const s = store.get().settings;
  const layout = s.dashboardLayout && s.dashboardLayout.length ? s.dashboardLayout : Object.keys(DASHBOARD_WIDGETS);
  const hidden = new Set(s.dashboardHidden || []);
  const relevant = layout.filter(key => DASHBOARD_WIDGETS[key] && (!DASHBOARD_WIDGETS[key].moduleKey || ModuleManager.isEnabled(DASHBOARD_WIDGETS[key].moduleKey)));

  node.innerHTML = '';
  relevant.forEach((key, i) => {
    const def = DASHBOARD_WIDGETS[key];
    const isHidden = hidden.has(key);
    const row = el(`
      <div class="settings-row">
        <div style="flex:1;${isHidden ? 'opacity:.45' : ''}"><div class="row-title">${def.label}</div></div>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="icon-btn" data-act="up" data-key="${key}" ${i === 0 ? 'disabled style="opacity:.3"' : ''} style="width:32px;height:32px;font-size:14px">▲</button>
          <button class="icon-btn" data-act="down" data-key="${key}" ${i === relevant.length - 1 ? 'disabled style="opacity:.3"' : ''} style="width:32px;height:32px;font-size:14px">▼</button>
          <div class="toggle ${!isHidden ? 'on' : ''}" data-act="toggle" data-key="${key}" style="margin-left:6px"><div class="dot"></div></div>
        </div>
      </div>
    `);
    node.appendChild(row);
  });

  node.querySelectorAll('[data-act="up"]').forEach(btn => btn.addEventListener('click', () => moveWidget(btn.dataset.key, -1, node, root)));
  node.querySelectorAll('[data-act="down"]').forEach(btn => btn.addEventListener('click', () => moveWidget(btn.dataset.key, 1, node, root)));
  node.querySelectorAll('[data-act="toggle"]').forEach(t2 => t2.addEventListener('click', () => toggleWidget(t2.dataset.key, node, root)));
}

function moveWidget(key, dir, node, root) {
  const s = store.get().settings;
  const layout = [...(s.dashboardLayout && s.dashboardLayout.length ? s.dashboardLayout : Object.keys(DASHBOARD_WIDGETS))];
  const relevant = layout.filter(k => DASHBOARD_WIDGETS[k] && (!DASHBOARD_WIDGETS[k].moduleKey || ModuleManager.isEnabled(DASHBOARD_WIDGETS[k].moduleKey)));
  const posInRelevant = relevant.indexOf(key);
  const swapWith = relevant[posInRelevant + dir];
  if (!swapWith) return;
  const a = layout.indexOf(key), b = layout.indexOf(swapWith);
  [layout[a], layout[b]] = [layout[b], layout[a]];
  store.commit(d => { d.settings.dashboardLayout = layout; });
  renderDashboardCard(node, root);
}

function toggleWidget(key, node, root) {
  store.commit(d => {
    const hidden = new Set(d.settings.dashboardHidden || []);
    if (hidden.has(key)) hidden.delete(key); else hidden.add(key);
    d.settings.dashboardHidden = [...hidden];
  });
  renderDashboardCard(node, root);
}

// ---- services/goals.js ----
const GOAL_COLORS = ['#C8A84B', '#3DD68C', '#5B8DEF', '#FF6B6B', '#F5B942', '#B98BE0'];

const GoalsService = {
  list() {
    return store.get().goals.sort((a, b) => (a.targetDate || '9999').localeCompare(b.targetDate || '9999'));
  },

  get(id) {
    return store.get().goals.find(g => g.id === id);
  },

  create({ name, icon, color, targetAmount, currentAmount, targetDate, accountId, notes }) {
    const goal = {
      id: uid(),
      name: name.trim(),
      icon: icon || '🎯',
      color: color || GOAL_COLORS[0],
      targetAmount: Number(targetAmount) || 0,
      currentAmount: Number(currentAmount) || 0,
      targetDate: targetDate || null,
      accountId: accountId || null,
      notes: notes || '',
      createdAt: nowISO(),
      updatedAt: nowISO(),
    };
    store.commit(d => d.goals.push(goal));
    return goal;
  },

  update(id, patch) {
    store.commit(d => {
      const g = d.goals.find(x => x.id === id);
      if (g) Object.assign(g, patch, { updatedAt: nowISO() });
    });
  },

  contribute(id, amount) {
    store.commit(d => {
      const g = d.goals.find(x => x.id === id);
      if (g) { g.currentAmount = Math.max(0, g.currentAmount + Number(amount)); g.updatedAt = nowISO(); }
    });
  },

  delete(id) {
    store.commit(d => { d.goals = d.goals.filter(g => g.id !== id); });
  },

  progress(id) {
    const g = this.get(id);
    if (!g) return 0;
    if (g.targetAmount <= 0) return 0;
    return Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100));
  },
};
